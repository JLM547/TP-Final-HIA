services:

   # NGINX Reverse Proxy con Mitigación DDoS y HTTPS/SSL (Punto 9.3 & 9.4)
  nginx-proxy:
    image: nginx:latest
    container_name: tienda-nginx
    restart: unless-stopped
    volumes:
      # Usamos la configuración con HTTPS y Rate Limiting
      - ./nginx/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      # Montamos los certificados generados
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "8080:80"    # Para redireccionar a 443
      - "443:443"  # El nuevo puerto seguro para HTTPS
    depends_on:
      - frontend
      - backend
    networks:
      - tienda-network
      
  # MongoDB Database
  mongo-db:
    image: mongo:7.0
    hostname: mongo1
    container_name: tienda-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: tienda
    ports:
      - "27017:27017"
    entrypoint: ["/bin/bash", "/scripts/init-entrypoint.sh"]
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./database/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ./keys:/keys
      - ./scripts:/scripts
    networks:
      - tienda-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    
  mongo-db2:
    image: mongo:7.0
    hostname: mongo2
    container_name: mongo2
    ports:
      - 27018:27017
    entrypoint: ["mongod", "--replSet", "myReplicaSet", "--bind_ip_all", "--keyFile", "keys/key2/key" ]
    #entrypoint: ["mongod", "--replSet", "myReplicaSet", "--bind_ip_all"]
    volumes:
      - mongodb2_data:/data/db
      - ./keys:/keys
    networks:
      - tienda-network
    depends_on:
      - mongo-db

  mongo-db3:
    image: mongo:7.0
    hostname: mongo3
    container_name: mongo3
    ports:
      - 27019:27017
    entrypoint: ["mongod", "--replSet", "myReplicaSet", "--bind_ip_all", "--keyFile", "keys/key3/key" ]
    #entrypoint: ["mongod", "--replSet", "myReplicaSet", "--bind_ip_all"]
    volumes:
      - mongodb3_data:/data/db
      - ./keys:/keys
    networks:
      - tienda-network
    depends_on:
      - mongo-db

  mongosetup:
    image: mongo:7.0
    depends_on:
      - mongo-db
      - mongo-db2
      - mongo-db3
    volumes:
      - ./scripts:/scripts
    restart: "no"
    entrypoint: [ "/bin/bash", "/scripts/mongo_setup.sh"]
    networks:
      - tienda-network

  # Mongo Express - Web UI for MongoDB
  mongo-express:
    image: mongo-express:latest
    container_name: tienda-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongo1:27017,mongo2:27017,mongo3:27017/?authSource=admin&replicaSet=myReplicaSet
      ME_CONFIG_MONGODB_SERVER: mongo1
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
      ME_CONFIG_MONGODB_AUTH_DATABASE: admin
    ports:
      - "8081:8081"
    depends_on:
      mongo-db:
        condition: service_healthy
    networks:
      - tienda-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8081 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Backend Node.js
  backend:
    build:
      context: ./proybackendgrupo13
      dockerfile: Dockerfile
    container_name: tienda-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://admin:admin123@mongo1:27017,mongo2:27017,mongo3:27017/tienda?authSource=admin&replicaSet=myReplicaSet&readPreference=secondaryPreferred
      - JWT_SECRET=${JWT_SECRET:-1234567890}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-427682572521-5cvcnk79ge40i8hfcfrtulv2n5ljm5qt.apps.googleusercontent.com}
    ports:
      - "3000:3000"
    volumes:
      - ./proybackendgrupo13:/app
      - /app/node_modules
    depends_on:
      mongo-db:
        condition: service_healthy
    networks:
      - tienda-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Angular
  frontend:
    build:
      context: ./proyectofrontendgrupo13/frontend
      dockerfile: Dockerfile
    container_name: tienda-frontend
    restart: unless-stopped
    # Puerto removido - ahora se accede a través de nginx-proxy
    # ports:
    #   - "8080:80"
    depends_on:
      - backend
    networks:
      - tienda-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Prometheus - Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: tienda-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - mongodb-exporter-1
      - mongodb-exporter-2
      - mongodb-exporter-3
      - cadvisor
    networks:
      - tienda-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: tienda-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - tienda-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MongoDB Exporter para Prometheus - Nodo 1 (tienda-mongodb)
  mongodb-exporter-1:
    image: percona/mongodb_exporter:0.39
    container_name: tienda-mongodb-exporter-1
    restart: unless-stopped
    command:
      - '--mongodb.uri=mongodb://admin:admin123@mongo1:27017/?authSource=admin&replicaSet=myReplicaSet'
    ports:
      - "9216:9216"
    depends_on:
      mongo-db:
        condition: service_healthy
    networks:
      - tienda-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9216/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MongoDB Exporter para Prometheus - Nodo 2 (mongo2)
  mongodb-exporter-2:
    image: percona/mongodb_exporter:0.39
    container_name: tienda-mongodb-exporter-2
    restart: unless-stopped
    command:
      - '--mongodb.uri=mongodb://admin:admin123@mongo2:27017/?authSource=admin&replicaSet=myReplicaSet'
    ports:
      - "9217:9216"
    depends_on:
      mongo-db2:
        condition: service_started
    networks:
      - tienda-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9216/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MongoDB Exporter para Prometheus - Nodo 3 (mongo3)
  mongodb-exporter-3:
    image: percona/mongodb_exporter:0.39
    container_name: tienda-mongodb-exporter-3
    restart: unless-stopped
    command:
      - '--mongodb.uri=mongodb://admin:admin123@mongo3:27017/?authSource=admin&replicaSet=myReplicaSet'
    ports:
      - "9218:9216"
    depends_on:
      mongo-db3:
        condition: service_started
    networks:
      - tienda-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9216/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # cAdvisor - Métricas de contenedores Docker
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: tienda-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8083:8080"
    networks:
      - tienda-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MongoDB Backup Automático - Contenedor adicional para backups programados
  mongodb-backup:
    build:
      context: .
      dockerfile: ./database/Dockerfile.backup
    container_name: tienda-mongodb-backup
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://admin:admin123@mongo1:27017,mongo2:27017,mongo3:27017/?authSource=admin&replicaSet=myReplicaSet
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}  # Por defecto: 2 AM diariamente (formato cron)
      - RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}    # Retener backups por 7 días
      - RUN_INITIAL_BACKUP=${RUN_INITIAL_BACKUP:-false} # Ejecutar backup al iniciar (opcional)
    volumes:
      - mongodb_backups:/backups
      # No montar scripts como volumen, ya están en la imagen
    depends_on:
      mongo-db:
        condition: service_healthy
      mongo-db2:
        condition: service_started
      mongo-db3:
        condition: service_started
    networks:
      - tienda-network
    healthcheck:
      test: ["CMD-SHELL", "pgrep cron || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MariaDB para NextCloud
  nextcloud-db:
    image: mariadb:10.11
    container_name: tienda-nextcloud-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASSWORD:-nextcloud_root_pass}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-nextcloud_pass}
    volumes:
      - nextcloud_db_data:/var/lib/mysql
    networks:
      - tienda-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NextCloud - Gestión Documental
  nextcloud:
    image: nextcloud:latest
    container_name: tienda-nextcloud
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:-admin123}
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD:-nextcloud_pass}
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost 127.0.0.1 *.loca.lt loca.lt
    volumes:
      - nextcloud_data:/var/www/html
    command: >
      bash -c "
      chown -R www-data:www-data /var/www/html/data || true &&
      chmod -R 755 /var/www/html/data || true &&
      /entrypoint.sh apache2-foreground
      "
    depends_on:
      nextcloud-db:
        condition: service_healthy
    networks:
      - tienda-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/status.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Módulo de IA para Análisis de Datos (Opcional)
  ia-analytics:
    build:
      context: ./nextcloud/ia-analytics
      dockerfile: Dockerfile
    container_name: tienda-ia-analytics
    restart: "no"  # Solo se ejecuta manualmente
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - OUTPUT_DIR=/app/reportes
      - MONGODB_URI=mongodb://admin:admin123@mongo1:27017,mongo2:27017,mongo3:27017/?authSource=admin&replicaSet=myReplicaSet
      - NEXTCLOUD_DATA_PATH=/var/www/html/data
    volumes:
      - ./nextcloud/reportes:/app/reportes
      - nextcloud_data:/var/www/html/data:ro  # Acceso de solo lectura a NextCloud
    depends_on:
      - prometheus
      - mongo-db
      - nextcloud
    networks:
      - tienda-network
    profiles:
      - ia  # Solo se ejecuta con --profile ia

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  mongodb2_data:
    driver: local
  mongodb3_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nextcloud_db_data:
    driver: local
  nextcloud_data:
    driver: local
  mongodb_backups:
    driver: local

networks:
  tienda-network:
    driver: bridge

