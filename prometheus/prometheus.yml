global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'tienda-monitor'

# Configuración de alertas (opcional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Reglas de alertas (opcional)
rule_files:
  # - "alerts.yml"

# Configuración de scraping
scrape_configs:
  # Prometheus se monitorea a sí mismo
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend Node.js - Métricas de aplicación
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 15s

  # MongoDB Exporter (descomentar si activas el servicio mongodb-exporter)
  # - job_name: 'mongodb'
  #   static_configs:
  #     - targets: ['mongodb-exporter:9216']
  #   scrape_interval: 15s

  # Métricas de contenedores Docker (si usas cAdvisor)
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']

