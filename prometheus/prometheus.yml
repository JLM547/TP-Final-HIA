global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'tienda-monitor'

# Configuración de alertas (opcional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Reglas de alertas (opcional)
rule_files:
  # - "alerts.yml"

# Configuración de scraping
scrape_configs:
  # Prometheus se monitorea a sí mismo
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend Node.js - Métricas de aplicación
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 15s

  # MongoDB Exporter - Nodo 1 (tienda-mongodb)
  - job_name: 'mongodb-node1'
    static_configs:
      - targets: ['mongodb-exporter-1:9216']
        labels:
          instance: 'mongo1'
          node: 'primary'
    scrape_interval: 15s
    scrape_timeout: 10s

  # MongoDB Exporter - Nodo 2 (mongo2)
  - job_name: 'mongodb-node2'
    static_configs:
      - targets: ['mongodb-exporter-2:9216']
        labels:
          instance: 'mongo2'
          node: 'secondary'
    scrape_interval: 15s
    scrape_timeout: 10s

  # MongoDB Exporter - Nodo 3 (mongo3)
  - job_name: 'mongodb-node3'
    static_configs:
      - targets: ['mongodb-exporter-3:9216']
        labels:
          instance: 'mongo3'
          node: 'secondary'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Métricas de contenedores Docker (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s
    scrape_timeout: 10s

